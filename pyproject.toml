[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jass-rl"
version = "0.2.0"
description = "Rule-correct Swiss Schieber simulation, training, evaluation, and advice"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = []

[project.optional-dependencies]
rl = [
    "gymnasium>=1.1,<2",
    "numpy>=2.0,<3",
    "pettingzoo>=1.24,<2",
    "sb3-contrib>=2.6,<3",
    "stable-baselines3>=2.6,<3",
    "torch>=2.5,<3",
]
dev = [
    "hypothesis>=6.100,<7",
    "pytest>=8,<10",
    "pytest-cov>=5,<8",
    "ruff>=0.11,<1",
]
media = [
    "pillow>=12,<13",
]

[project.scripts]
jass-advisor = "rl.advisor:main"
jass-advisor-web = "rl.advisor_web:main"
jass-play = "cli.play:main"
jass-replay = "cli.replay:main"
jass-train = "rl.train_selfplay:main"
jass-eval = "rl.eval:main"
jass-merge-evals = "rl.merge_evaluations:main"
jass-qualify = "rl.qualify_hybrid:main"

[tool.setuptools]
packages = ["core", "core.announcements", "env", "rl", "rl.static", "cli"]

[tool.setuptools.package-data]
rl = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E402"]
